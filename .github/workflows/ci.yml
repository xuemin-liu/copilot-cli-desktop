name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # A branch of this repository is tested by its push. The pull_request run is for pull requests from forks, which no
    # push here covers; without this condition every pull request from a branch here would be tested twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Unit tests
        run: corepack pnpm test
      # A pilot: one real-app check, on Windows only, that cannot fail the run. If it proves stable on hosted runners,
      # more of the checks under scripts/ can follow and this one can become required.
      - name: Terminal links in the real app (pilot, not required)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        run: corepack pnpm links:check
      - name: Package (unsigned)
        if: runner.os != 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: corepack pnpm ${{ runner.os == 'macOS' && 'dist:mac' || 'dist:linux' }}
