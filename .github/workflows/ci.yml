name: CI

on:
  # A pull request is built once (pull_request); pushes only build main and release tags. Building every branch push as well
  # ran each pull-request commit twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install pinned Copilot CLI for instruction discovery checks
        run: npm install --global @github/copilot@1.0.91
      - name: Type-check
        run: corepack pnpm typecheck
      - name: Unit tests
        run: corepack pnpm test
      - name: Terminal link integration check
        run: corepack pnpm links:check
      - name: Sidebar Projects interaction check
        run: corepack pnpm sidebar:check
      - name: Git panel IPC check
        run: corepack pnpm git:check
      - name: Browser and native Local Overrides integration check
        run: corepack pnpm browser:check
      - name: Browser testing at 125% display scale
        run: node scripts/browser-test-check.mjs --force-device-scale-factor=1.25
      - name: Upload browser check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-check
          path: |
            test-results/browser-debug/
            test-results/browser-persistence/
            test-results/browser-reader/
            test-results/browser-testing/
            test-results/sidebar-projects-check/
            test-results/git-ipc/
          if-no-files-found: ignore
          retention-days: 7
      - name: Migration round-trip smoke test
        run: corepack pnpm migration:smoke
      - name: Migration Settings integration check
        run: corepack pnpm migration:check
      - name: Upload migration check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-check
          path: test-results/migration/
          if-no-files-found: ignore
          retention-days: 7
      - name: Best-effort live copilot smoke test
        run: corepack pnpm smoke
      - name: Best-effort background CLI smoke test
        run: corepack pnpm cli:smoke
      - name: Build unpacked Windows application
        run: corepack pnpm pack:win
      - name: Upload unpacked application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: copilot-cli-desktop-windows-unpacked
          path: release/win-unpacked/
          if-no-files-found: error
          compression-level: 0
          # About 400 MB each and nothing downloads it automatically, so keep it for a day only.
          retention-days: 1
