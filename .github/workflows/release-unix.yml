name: macOS and Linux release

# Adds macOS and Linux builds to a GitHub release. release.yml dispatches this into the draft it creates (a release it
# creates with GITHUB_TOKEN starts no `release` workflows). A release published by a person starts it through the
# `release` event, which builds only when the release does not already have both platforms' builds, so publishing a
# draft that release.yml filled does not replace them.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to, for example v0.1.56
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    if: >-
      github.event_name != 'release' ||
      !(contains(github.event.release.assets.*.name, 'latest-mac.yml') &&
      contains(github.event.release.assets.*.name, 'latest-linux.yml'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: dist:linux
            files: release/*.AppImage release/*.deb release/latest-linux.yml
            subjects: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-latest
            command: dist:mac
            files: release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
            subjects: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # The provenance attestation records the run's own ref and commit, not what was checked out, so a manual run must be
      # started on the release tag itself (gh workflow run release-unix.yml --ref vX.Y.Z -f tag=vX.Y.Z).
      - name: Validate release tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "This run is for $GITHUB_REF at $GITHUB_SHA, not tag $RELEASE_TAG; start it with --ref $RELEASE_TAG" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          corepack pnpm typecheck
          corepack pnpm test
      - name: Check macOS signing
        id: signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned macOS build::MAC_CSC_LINK is not set, so the app is not signed or notarized. macOS blocks it until the person allows it in System Settings, and it cannot update itself."
          fi
      - name: Build
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder treats a CSC_LINK that is set but empty as a certificate path (the project folder), so the signing
        # variables are set only when the macOS secrets exist.
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          corepack pnpm ${{ matrix.command }}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ matrix.subjects }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ${{ matrix.files }} --clobber
